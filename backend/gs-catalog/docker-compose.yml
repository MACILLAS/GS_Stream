services:
  gs-catalog:
    build: .
    ports:
      - "5000:5000"
    environment:
      GS_HOST: 0.0.0.0
      GS_DEBUG: "true"
      MONGO_HOST: mongo
      MONGO_PORT: 27017
    depends_on:
      - mongo
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
